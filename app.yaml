kind: wasmer.io/App.v0

name: lead
owner: ddcrm680

package: sha256:0f583d95a650245272fd1e05879f27036473b68b8da472698d658c9e129056d4

enableDatabase: true

env:
  PHPIX_PHP_THREADS: '4'

annotations:
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    node_build_command: npm run build
    node_install_inputs:
      - package.json
    node_package_manager: npm
    php_framework: laravel
    php_public_dir: public
    phpix: true

  anybuild.run/provider: laravel
  anybuild.run/version: 0.28.4
  wasmer.io/version: 7.4.1

jobs:
  - name: application-setup
    trigger: pre-deployment
    action:
      execute:
        command: php
        cli_args:
          - artisan
          - app:setup
          - --force
          - --with-lead-defaults
        timeout: 5m

  - name: after_deploy
    trigger: post-deployment
    action:
      execute:
        command: after_deploy
