[package]
name = "ddcrm680/lead"
version = "0.1.0"
description = "Lead CMS Laravel application"

[dependencies]
"php/php" = "=8.3.29"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "-t",
    "/app/public",
    "-S",
    "0.0.0.0:8080"
]

[[command]]
name = "setup"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "/app/artisan",
    "app:setup",
    "--force",
    "--with-lead-defaults"
]

[[command]]
name = "migrate"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "/app/artisan",
    "migrate",
    "--force"
]

# FIX IS HERE: Chaining both commands under one job execution
[[command]]
name = "after_deploy"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "/app/artisan",
    "app:setup",
    "--force",
    "--with-lead-defaults"
]


